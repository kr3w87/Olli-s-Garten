<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beetbuch – Gemüse, Fruchtfolge & Beetplaner</title>
<meta name="theme-color" content="#2B2419">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --soil:#2B2419;
    --soil-darker:#1C1710;
    --paper:#F3EEDD;
    --paper-shadow:#E4DCC0;
    --moss:#5B7553;
    --moss-dark:#3E5238;
    --mustard:#D4A73D;
    --tomato:#C1543C;
    --ink:#2B2419;
    --cream:#F3EEDD;
    --line:#00000022;
    --radius-sm:12px;
    --radius-md:16px;
    --radius-lg:22px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  /* ---------- Tastendruck-Feedback: sofortige Rückmeldung beim Antippen ---------- */
  button,.packet,.plantcard,.chip,.gcell.occ{
    transition:transform .12s ease,opacity .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button:active,.packet:active,.plantcard:active,.chip:active,.gcell.occ:active{
    transform:scale(.96);opacity:.85;
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--soil);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:700;
    letter-spacing:.2px;
  }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:.68rem;
    font-weight:700;
    color:var(--mustard);
    font-family:Georgia,serif;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  /* ---------- Header ---------- */
  header.app{
    padding:22px 18px 16px;
    background:linear-gradient(180deg,var(--soil-darker),var(--soil));
    border-bottom:1px solid #ffffff14;
    position:sticky; top:0; z-index:5;
  }
  header.app h1{font-size:1.5rem;margin:2px 0 2px;color:var(--cream);}
  header.app p{margin:0;color:#F3EEDDaa;font-size:.85rem;}

  main{max-width:640px;margin:0 auto;padding:16px;}

  /* ---------- Tab bar ---------- */
  nav.tabbar{
    position:fixed;bottom:14px;left:14px;right:14px;
    display:flex;background:var(--soil-darker);
    border-radius:22px;
    z-index:10;
    padding:6px;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 10px 28px #00000055;
    border:1px solid #ffffff14;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;color:#F3EEDD88;
    padding:8px 4px;font-size:.68rem;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    letter-spacing:.03em;
    border-radius:15px;
    margin:0 1px;
    transition:transform .12s ease,opacity .12s ease,background-color .2s ease;
  }
  nav.tabbar button .ic{font-size:1.25rem;}
  nav.tabbar button.active{color:var(--mustard);background:#ffffff14;}
  nav.tabbar button.active .ic{transform:translateY(-2px);}

  .view{display:none;}
  .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- Search / filter ---------- */
  .searchrow{display:flex;gap:8px;margin-bottom:14px;}
  input[type="search"],select{
    background:var(--paper);color:var(--ink);border:none;border-radius:var(--radius-sm);
    padding:10px 12px;font-size:.9rem;font-family:inherit;
  }
  input[type="search"]{flex:1;}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{
    background:none;border:1px solid #F3EEDD3a;color:#F3EEDDcc;
    border-radius:999px;padding:5px 12px;font-size:.72rem;font-family:inherit;
    letter-spacing:.02em;transition:transform .1s ease;-webkit-tap-highlight-color:transparent;
  }
  .chip:active{transform:scale(.94);}
  .chip.active{background:var(--moss);border-color:var(--moss);color:#fff;}

  /* ---------- Seed packet card (signature element) ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:420px){.grid{grid-template-columns:1fr;}}
  .packet{
    background:var(--paper);color:var(--ink);border-radius:var(--radius-md);
    position:relative;overflow:hidden;cursor:pointer;
    box-shadow:0 3px 0 var(--paper-shadow), 0 8px 16px #00000030;
    padding:14px 12px 12px;
    border-top:8px solid var(--moss);
    transition:transform .12s ease,box-shadow .12s ease;-webkit-tap-highlight-color:transparent;
  }
  .packet:active{transform:scale(.97);box-shadow:0 1px 0 var(--paper-shadow),0 4px 10px #00000030;}
  .packet::after{
    content:"";position:absolute;top:0;left:0;right:0;height:8px;
    background:repeating-linear-gradient(90deg,var(--soil) 0 6px, transparent 6px 12px);
    opacity:.35;
    border-radius:14px 14px 0 0;
  }
  .packet .fam-badge{
    display:inline-block;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;
    background:var(--soil);color:var(--mustard);padding:2px 7px;border-radius:3px;margin-bottom:6px;
    font-family:Georgia,serif;font-weight:700;
  }
  .packet h3{margin:0 0 2px;font-size:1.02rem;}
  .packet .sub{font-size:.72rem;color:#00000090;margin-bottom:8px;}
  .beebadge{
    display:inline-flex;align-items:center;gap:3px;font-size:.62rem;font-weight:700;
    background:#D4A73D22;color:#8B6A1F;padding:2px 7px;border-radius:3px;margin:0 0 6px 5px;
    vertical-align:top;
  }
  .birdbadge{
    display:inline-flex;align-items:center;gap:3px;font-size:.62rem;font-weight:700;
    background:#6E8FA022;color:#3f5a68;padding:2px 7px;border-radius:3px;margin:0 0 6px 5px;
    vertical-align:top;
  }

  /* month strip */
  .mstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;margin-top:4px;}
  .mstrip .mcell{display:flex;flex-direction:column;gap:1px;}
  .mstrip .seg{height:5px;background:#00000012;border-radius:1px;}
  .mstrip .seg.on-ds{background:var(--moss);}
  .mstrip .seg.on-vk{background:var(--mustard);}
  .mstrip .seg.on-ap{background:var(--moss-dark);}
  .mstrip .seg.on-er{background:var(--tomato);}
  .mstrip .mlabel{font-size:.5rem;text-align:center;color:#00000070;margin-top:2px;font-family:ui-monospace,monospace;}

  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.68rem;color:#F3EEDDaa;margin:10px 0 18px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  /* ---------- Detail sheet ---------- */
  .overlay{
    position:fixed;inset:0;background:#00000060;z-index:20;display:none;
    align-items:flex-end;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .2s ease;
  }
  .overlay.active{display:flex;}
  .sheet{
    background:var(--paper);color:var(--ink);width:100%;max-height:88vh;overflow-y:auto;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px 20px 32px;
    animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
  .sheet .handle{width:38px;height:4px;background:#0000002a;border-radius:2px;margin:0 auto 14px;}
  .sheet h2{margin:0 0 2px;font-size:1.35rem;}
  .sheet .sub{color:#00000080;font-size:.85rem;margin-bottom:14px;}
  .latname{font-style:italic;color:#00000070;font-size:.8rem;margin:-2px 0 4px;font-family:Georgia,serif;}
  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
  .infobox{background:#00000008;border-radius:var(--radius-sm);padding:8px 10px;}
  .infobox .eyebrow{color:var(--moss-dark);}
  .infobox p{margin:2px 0 0;font-size:.85rem;font-weight:600;}
  .sheet h4{margin:18px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--moss-dark);font-family:Georgia,serif;}
  .sheet ul{margin:0;padding-left:18px;font-size:.88rem;line-height:1.55;}
  .neighbors{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .tag{font-size:.72rem;padding:4px 10px;border-radius:999px;}
  .tag.good{background:#5B755322;color:var(--moss-dark);}
  .tag.bad{background:#C1543C22;color:var(--tomato);}
  .closebtn{position:sticky;top:0;float:right;background:var(--soil);color:var(--cream);border:none;
    width:30px;height:30px;border-radius:50%;font-size:1rem;line-height:1;}

  /* ---------- Buttons ---------- */
  .btn{
    background:var(--moss);color:#fff;border:none;border-radius:var(--radius-sm);
    padding:11px 16px;font-size:.88rem;font-weight:600;font-family:inherit;
    transition:transform .1s ease,opacity .1s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.96);opacity:.85;}
  .btn.secondary{background:none;border:1px solid #F3EEDD40;color:var(--cream);}
  .btn.small{padding:6px 12px;font-size:.78rem;}
  .btn.block{width:100%;}
  .btn.tomato{background:var(--tomato);}

  /* ---------- Beds ---------- */
  .bed{
    background:var(--paper);color:var(--ink);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:14px;
    box-shadow:0 6px 14px #00000025;
  }
  .bed .bedhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .bed h3{margin:0;font-size:1.05rem;}
  .bed .bedmeta{font-size:.72rem;color:#00000080;}
  .plantrow{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-top:1px solid #00000012;font-size:.85rem;
    transition:opacity .1s ease;-webkit-tap-highlight-color:transparent;
  }
  .plantrow[data-open]:active,.plantrow.plantrow-lg:active{opacity:.6;}
  .plantrow .fam{font-size:.68rem;color:#00000070;}

  /* ---------- Teich: größere, prominente Darstellung ---------- */
  .teichcard{padding:18px 18px 16px;}
  .teichcard h3{font-size:1.25rem;}
  .teichcard .bedmeta{font-size:.8rem;}
  .pondphoto{
    width:100%;height:130px;border-radius:10px;margin-bottom:12px;position:relative;overflow:hidden;
    background:#00000010;display:flex;align-items:center;justify-content:center;
  }
  .pondphoto img{width:100%;height:100%;object-fit:cover;display:block;}
  .pondphoto-btn{
    background:none;border:1px dashed #00000030;color:var(--ink);border-radius:8px;
    padding:9px 16px;font-size:.8rem;font-family:inherit;
  }
  .pondphoto-mini{
    position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;
    background:#ffffffdd;border:none;font-size:.9rem;box-shadow:0 1px 3px #00000040;
  }

  .plantcards{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .plantcard{
    display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;
    background:#00000006;cursor:pointer;transition:background .15s;
  }
  .plantcard:active{background:#00000012;}
  .plantcard-thumb{
    width:46px;height:46px;border-radius:10px;flex:0 0 auto;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .plantcard-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .plantcard-info{flex:1;min-width:0;}
  .plantcard-info b{font-size:.9rem;}
  .plantcard-info .fam{font-size:.7rem;color:#00000070;margin-top:2px;}
  .plantrow-lg{padding:13px 2px;font-size:.95rem;}
  .plantrow-lg b{font-size:1rem;}
  .plantrow-lg .fam{font-size:.75rem;}
  .plantrow-lg .rowdel{width:22px;height:22px;font-size:.62rem;}
  .warnbox{
    background:#C1543C1c;border:1px solid #C1543C55;color:#8a3a29;
    border-radius:10px;padding:9px 12px;font-size:.78rem;margin-top:8px;line-height:1.4;
  }
  .okbox{
    background:#5B75331c;border:1px solid #5B755355;color:var(--moss-dark);
    border-radius:10px;padding:9px 12px;font-size:.78rem;margin-top:8px;line-height:1.4;
  }
  .emptystate{
    text-align:center;padding:40px 20px;color:#F3EEDD90;
  }
  .emptystate .ic{font-size:2.2rem;display:block;margin-bottom:10px;}

  /* ---------- Modal form ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--moss-dark);margin-bottom:5px;font-family:Georgia,serif;}
  .field input,.field select{width:100%;}

  /* ---------- Calendar view ---------- */
  .monthpicker{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
  .monthpicker button{
    flex:0 0 auto;background:var(--paper);color:var(--ink);border:none;border-radius:10px;
    padding:10px 14px;font-size:.8rem;font-family:Georgia,serif;font-weight:700;
  }
  .monthpicker button.active{background:var(--mustard);}
  .calsection{margin-bottom:20px;}
  .calsection h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;display:flex;align-items:center;gap:7px;}
  .calsection h3 i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .callist{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;}
  .callist .item{padding:10px 14px;font-size:.85rem;border-top:1px solid #00000010;}
  .callist .item:first-child{border-top:none;}
  .callist .item b{font-weight:700;}
  .callist .item span{color:#00000080;font-size:.75rem;}
  .callist-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mustard);margin:10px 0 5px 2px;font-family:Georgia,serif;font-weight:700;}
  .callist-label:first-of-type{margin-top:6px;}
  .callist{margin-bottom:4px;}

  /* ---------- Lageplan grid ---------- */
  .bedgrid{display:grid;gap:5px;margin:10px 0;}
  .gcell{
    aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:2px;font-size:.56rem;font-weight:700;color:#fff;line-height:1.15;
    overflow:hidden;transition:transform .1s ease;-webkit-tap-highlight-color:transparent;
  }
  .gcell:active{transform:scale(.92);}
  .gcell.empty{background:#00000010;color:#00000035;border:1px dashed #00000030;font-size:1rem;font-weight:400;}
  .gcell{position:relative;}
  .gcell-del{
    position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;
    background:var(--tomato);color:#fff;border:1.5px solid var(--paper);font-size:.42rem;
    line-height:1;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .unplaced{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;}
  .unplaced .tag{background:#00000010;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .tagdel{color:var(--tomato);font-weight:700;cursor:pointer;padding:0 2px;}

  /* ---------- Teich-Werkzeuge ---------- */
  .toolcard{
    background:var(--paper);color:var(--ink);padding:14px;border-radius:var(--radius-md);
    box-shadow:0 2px 6px #00000020;margin-bottom:4px;
  }
  .toolcard .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .toolcard label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--moss-dark);margin-bottom:4px;font-family:Georgia,serif;}
  .toolcard input,.toolcard select{width:100%;background:#00000008;border:none;border-radius:8px;padding:8px 9px;font-size:.85rem;font-family:inherit;color:var(--ink);}
  .volresult{
    margin-top:12px;padding:10px 12px;background:#5B755320;border-radius:10px;
    font-size:1rem;font-weight:700;color:var(--moss-dark);text-align:center;
  }
  .werteliste{margin-top:10px;}
  .wertitem{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 0;border-top:1px solid #00000012;font-size:.8rem;
  }
  .wertitem:first-child{border-top:none;}
  .moongrid{display:flex;flex-wrap:wrap;gap:4px;}
  .moonday{
    width:13.5%;min-width:34px;text-align:center;font-size:1rem;padding:4px 0;border-radius:6px;
  }
  .moonday.today{background:var(--mustard);}
  .moonday .moonnum{font-size:.55rem;color:#00000070;margin-top:1px;}
  .moonday.today .moonnum{color:var(--soil);font-weight:700;}

  /* ---------- Zehrertyp-Kennzeichnung ---------- */
  .zehrerbadge{
    border:1.5px solid; border-radius:10px; padding:8px 12px; margin-bottom:8px;
    font-size:.78rem; font-weight:700; display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline;
    background:#00000006;
  }
  .zehrerdetail{font-weight:400;color:#00000070;font-size:.72rem;}
  .zehrernext{width:100%;font-weight:400;color:#00000080;font-size:.72rem;}

  /* ---------- Schnell hinzufügen/entfernen (Stauden & Teich) ---------- */
  .quickadd{
    position:absolute;bottom:10px;right:10px;width:30px;height:30px;border-radius:50%;
    background:var(--moss);color:#fff;border:none;font-size:1.1rem;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #00000030;padding:0;
  }
  .quickadd.added{background:var(--moss-dark);}
  .rowopen{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0;}
  .rowdel{
    width:20px;height:20px;border-radius:50%;background:var(--tomato);color:#fff;border:none;
    font-size:.58rem;flex:0 0 auto;padding:0;
  }

  /* ---------- Erinnerungen ---------- */
  .remindbar{
    background:linear-gradient(135deg,#C1543C,#a8452f);color:#fff;border-radius:12px;
    padding:12px 14px;margin-bottom:14px;font-size:.85rem;
  }
  .remindbar .rtitle{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .remindbar .ritem{padding:6px 0;font-size:.8rem;opacity:.95;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:opacity .2s;}
  .remindbar .ritem-text{cursor:pointer;text-decoration:underline;text-decoration-color:#ffffff55;flex:1;min-width:0;}
  .quickdone{
    flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#ffffff;color:var(--moss-dark);
    border:none;font-size:1rem;font-weight:900;box-shadow:0 1px 3px #00000030;
  }
  .notifyrow{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .notifybtn{
    background:none;border:1px solid #F3EEDD3a;color:#F3EEDDcc;border-radius:999px;
    padding:6px 13px;font-size:.72rem;font-family:inherit;
  }
  .notifybtn.on{background:var(--mustard);border-color:var(--mustard);color:var(--soil);}
  .tabbar .dot{
    position:absolute;top:6px;right:calc(50% - 20px);width:7px;height:7px;border-radius:50%;background:var(--tomato);
  }
  nav.tabbar button{position:relative;}

  /* ---------- Pflanzen-Icons ---------- */
  .packet{position:relative;}
  .picon{
    position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;
    background:#ffffffb0;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px #00000025;
  }
  .picon-lg{
    width:64px;height:64px;border-radius:50%;background:#ffffffb0;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #00000025;
    float:right;margin-left:10px;
  }
  .wintercare{
    background:#6E8FA022;border:1px solid #6E8FA055;color:#3f5a68;
    border-radius:10px;padding:10px 12px;font-size:.85rem;line-height:1.5;margin-top:4px;
  }
  body.light{
    --soil:#EDE7D8;
    --soil-darker:#E2D9C4;
    --paper:#FFFFFF;
    --paper-shadow:#E4DCC0;
    --cream:#2B2419;
  }
  body.light header.app p{color:#2B241999;}
  body.light nav.tabbar button{color:#2B241977;}
  body.light nav.tabbar button.active{color:var(--moss-dark);}
  body.light .notifybtn{border-color:#2B241944;color:#2B2419bb;}
  body.light .legend{color:#2B241999;}
  body.light .emptystate{color:#2B241977;}
  body.light .chip{border-color:#2B241944;color:#2B2419bb;}
  body.light .chip.active{background:var(--moss);border-color:var(--moss);color:#fff;}
  body.light .fam-badge{background:var(--moss-dark);color:#fff;}
  body.light .closebtn{color:#fff;}
  .themetoggle{
    position:absolute;top:20px;right:18px;background:none;border:1px solid #F3EEDD3a;
    color:var(--cream);border-radius:50%;width:34px;height:34px;font-size:1rem;
  }
  body.light .themetoggle{border-color:#2B241944;}

  .wintercare li{margin-bottom:3px;}

  #printArea{display:none;}
  .printlabel{
    border:1px dashed #999;border-radius:4px;padding:3mm;break-inside:avoid;background:#fff;color:#222;
  }
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
  }

  .wholebedbanner{
    background:#7A9B4E22;border:1px solid #7A9B4E55;border-radius:10px;padding:4px 4px;margin-bottom:2px;
  }
  .wholebedbanner .gditem{
    padding:8px 10px;font-size:.82rem;color:#3d5424;cursor:pointer;

function vegById(name){ return VEG.find(v=>v.n===name) || GRUENDUENGUNG.find(v=>v.n===name) || STAUDEN.find(v=>v.n===name); }

function plantKind(v){
  if(!v) return null;
  if(GRUENDUENGUNG.includes(v)) return "gruen";
  if(STAUDEN.includes(v)) return "staude";
  return "veg";
}
function famLabelFor(v){
  const kind = plantKind(v);
  if(kind==="gruen") return "Gründüngung";
  if(kind==="staude") return "Staude";
  return FAMILIES[v.fk] || v.fk;
}
function plantColor(v){
  if(!v) return "#6b6b58";
  if(v.farbe) return v.farbe;
  return famColor(v.fk);
}

function giessInterval(v){
  if(v.giess) return v.giess;
  if(v.perennial) return 6;
  const map = {kuerbis:2,nacht:3,kohl:4,gaense:4,korb:3,dolde:4,allium:4,huelse:5,lippen:3};
  return map[v.fk] || 4;
}
function fmtDate(iso){
  if(!iso) return null;
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function daysSince(iso){
  if(!iso) return null;
  const d = new Date(iso+"T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now-d)/86400000);
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

   ECHTE PFLANZENFOTOS (optional, über eigenes Supabase-Storage)
   Fällt automatisch auf das Icon zurück, wenn kein Foto hinterlegt ist.
   ==================================================================== */
const SUPABASE_URL_KEY = "beetbuch_supabase_url";
const SUPABASE_BUCKET_KEY = "beetbuch_supabase_bucket";

/* Verzögert Aufrufe (z. B. beim Tippen in Suchfeldern), damit nicht bei jedem
   einzelnen Tastenanschlag neu gerendert und neu nach Fotos gefragt wird. */
function debounce(fn,delay){
  let timer = null;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(()=>fn.apply(this,args),delay);
  };
}

function slugifyPlant(name){
  return name.toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[()]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}
function getPlantPhotoUrl(name){
  const base = localStorage.getItem(SUPABASE_URL_KEY);
  if(!base) return null;
  const bucket = localStorage.getItem(SUPABASE_BUCKET_KEY) || "pflanzenfotos";
  return `${base.replace(/\/$/,"")}/storage/v1/object/public/${bucket}/${slugifyPlant(name)}.jpg`;
}
/* Gibt HTML zurück: echtes Foto, falls konfiguriert, mit automatischem Rückfall auf iconHtml bei Fehler/kein Foto */
const photoMissingCache = new Set();
window.__photoMissing = function(src){ photoMissingCache.add(src); };
function plantPhotoHtml(name,iconHtml,size){
  const src = getPlantPhotoUrl(name);
  if(!src) return iconHtml;
  if(photoMissingCache.has(src)) return iconHtml; // schon einmal als "nicht vorhanden" erkannt – kein erneuter Netzwerk-Versuch
  return `<span style="position:relative;display:block;width:${size}px;height:${size}px">
    <img src="${src}" alt="${name}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';window.__photoMissing('${src.replace(/'/g,"\\'")}');">
    <span style="display:none;position:absolute;inset:0;align-items:center;justify-content:center">${iconHtml}</span>
  </span>`;
}

/* ====================================================================
   WETTER – Open-Meteo (kein API-Key nötig), für smartere Gieß-Erinnerungen
   ==================================================================== */
const WEATHER_LOC_KEY = "beetbuch_weather_loc";
const WEATHER_KEY = "beetbuch_weather_cache";

async function fetchWeather(lat,lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation&daily=precipitation_sum,sunrise,sunset,temperature_2m_min&past_days=3&forecast_days=2&timezone=auto`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Wetter nicht abrufbar");
  return res.json();
}
function todaySunTimes(data){
  if(!data || !data.daily || !data.daily.sunrise) return null;
  const idx = data.daily.sunrise.length-2; // heute (forecast_days=2, also vorletzter Eintrag)
  const fmt = iso => iso ? iso.slice(11,16) : "–";
  return { sunrise: fmt(data.daily.sunrise[idx]), sunset: fmt(data.daily.sunset[idx]) };
}
function frostRisk(data){
  if(!data || !data.daily || !data.daily.temperature_2m_min) return null;
  const mins = data.daily.temperature_2m_min;
  const upcoming = mins.slice(-2); // heute + morgen
  const valid = upcoming.filter(v=>v!==null && v!==undefined);
  if(valid.length===0) return null;
  const minVal = Math.min(...valid);
  return { minVal, risk: minVal<=2 };
}
function rainLast3Days(data){
  if(!data || !data.daily || !data.daily.precipitation_sum) return null;
  const sums = data.daily.precipitation_sum;
  const past = sums.slice(0, Math.max(0,sums.length-2)); // die beiden Vorhersagetage ausklammern
  if(past.length===0) return null;
  return past.reduce((a,b)=>a+(b||0),0);
}
/* Gibt zusätzliche Tage zurück, um die eine Gieß-Fälligkeit bei ausreichend Regen verschoben wird */
function weatherRainBuffer(){
  try{
    const cached = JSON.parse(localStorage.getItem(WEATHER_KEY)||"null");
    if(!cached) return 0;
    const rain3 = rainLast3Days(cached.data);
    if(rain3===null) return 0;
    if(rain3>=8) return 3;
    if(rain3>=3) return 1;
    return 0;
  }catch(e){ return 0; }
}

function requestWeatherLocation(boxId){
  if(!("geolocation" in navigator)){ alert("Standortabfrage wird von diesem Browser nicht unterstützt."); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    localStorage.setItem(WEATHER_LOC_KEY, JSON.stringify({lat:pos.coords.latitude, lon:pos.coords.longitude}));
    localStorage.removeItem(WEATHER_KEY);
    renderWeatherWidget(boxId);
  }, ()=>{
    alert("Standort konnte nicht ermittelt werden. Bitte Standortzugriff in den Browsereinstellungen erlauben.");
  }, {timeout:10000});
}

async function renderWeatherWidget(boxId,forceRefresh){
  boxId = boxId || "weatherBox";
  const box = document.getElementById(boxId);
  if(!box) return;
  const loc = JSON.parse(localStorage.getItem(WEATHER_LOC_KEY)||"null");
  if(!loc){
    box.innerHTML = `<div class="toolcard">
      <div class="eyebrow">🌦️ Wetter</div>
      <p style="font-size:.82rem;margin:6px 0;color:var(--ink)">Standort freigeben, damit Gieß-Erinnerungen die letzten Regenfälle berücksichtigen.</p>
      <button class="btn small" id="weatherEnable-${boxId}">📍 Standort verwenden</button>
    </div>`;
    document.getElementById(`weatherEnable-${boxId}`).addEventListener("click",()=>requestWeatherLocation(boxId));
    return;
  }
  let cached = JSON.parse(localStorage.getItem(WEATHER_KEY)||"null");
  const stale = forceRefresh || !cached || (Date.now()-cached.fetchedAt) > 3*60*60*1000;
  if(stale){
    // Ladeanzeige, damit klar ist, dass gerade etwas passiert (Standort/Netzwerk brauchen kurz)
    box.innerHTML = `<div class="toolcard"><div class="eyebrow">🌦️ Wetter</div><p style="font-size:.82rem;margin:6px 0;color:var(--ink)">⏳ Lade aktuelle Wetterdaten…</p></div>`;
    try{
      const data = await fetchWeather(loc.lat,loc.lon);
      cached = {data, fetchedAt: Date.now()};
      localStorage.setItem(WEATHER_KEY, JSON.stringify(cached));
    }catch(e){ /* alten Cache weiterverwenden, falls vorhanden */ }
  }
  if(!cached){
    box.innerHTML = `<div class="toolcard"><div class="eyebrow">🌦️ Wetter</div><p style="font-size:.82rem;margin:6px 0;color:var(--ink)">Wetterdaten aktuell nicht verfügbar. Prüfe deine Internetverbindung.</p><button class="btn small secondary" id="weatherRetry-${boxId}" style="margin-top:6px">🔄 Erneut versuchen</button></div>`;
    document.getElementById(`weatherRetry-${boxId}`).addEventListener("click",()=>renderWeatherWidget(boxId,true));
    return;
  }
  const temp = cached.data.current ? cached.data.current.temperature_2m : undefined;
  const rain3 = rainLast3Days(cached.data);
  const dry = rain3!==null && rain3<3;
  const sun = todaySunTimes(cached.data);
  const frost = frostRisk(cached.data);
  const ageMin = Math.round((Date.now()-cached.fetchedAt)/60000);
  const ageText = ageMin<1 ? "gerade eben" : ageMin<60 ? `vor ${ageMin} Min.` : `vor ${Math.round(ageMin/60)} Std.`;
  box.innerHTML = `<div class="toolcard">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="eyebrow">🌦️ Wetter am Standort</div>
      <button id="weatherRefresh-${boxId}" title="Jetzt aktualisieren" style="background:none;border:none;font-size:1rem;padding:2px 4px;color:var(--moss-dark)">🔄</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--ink)">${temp!==undefined?Math.round(temp)+"°C":"–"}</div>
      <div style="font-size:.75rem;color:#00000080;text-align:right">Regen (3 Tage)<br><b style="color:var(--ink)">${rain3!==null?rain3.toFixed(1)+" mm":"–"}</b></div>
    </div>
    ${sun ? `<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:.78rem;color:var(--ink)">
      <span>🌅 Sonnenaufgang <b>${sun.sunrise}</b></span>
      <span>🌇 Sonnenuntergang <b>${sun.sunset}</b></span>
    </div>` : ""}
    ${frost && frost.risk ? `<div class="warnbox" style="margin-top:8px">❄️ Frostgefahr in den kommenden Nächten (min. ${frost.minVal.toFixed(1)}°C) – empfindliche Pflanzen abdecken oder reinholen!</div>` : ""}
    ${rain3!==null ? `<div class="${dry?'warnbox':'okbox'}" style="margin-top:8px">${dry?'☀️ Wenig Regen zuletzt – Gießen ist wahrscheinlich sinnvoll.':'💧 Genug Regen zuletzt – Gieß-Erinnerungen werden automatisch etwas verschoben.'}</div>` : ""}
    <div style="font-size:.66rem;color:#00000060;margin-top:6px">Aktualisiert ${ageText}</div>
  </div>`;
  document.getElementById(`weatherRefresh-${boxId}`).addEventListener("click",()=>renderWeatherWidget(boxId,true));
}

function getTasks(){
  const tasks = [];
  const todayM = new Date().getMonth()+1;
  const rainBuffer = weatherRainBuffer();

  // Frostgefahr – höchste Priorität, ganz oben in der Liste
  try{
    const cachedW = JSON.parse(localStorage.getItem(WEATHER_KEY)||"null");
    if(cachedW){
      const fr = frostRisk(cachedW.data);
      if(fr && fr.risk){
        tasks.push({icon:"❄️",text:`Frostgefahr in den kommenden Nächten (min. ${fr.minVal.toFixed(1)}°C) – empfindliche Pflanzen schützen`,onClick:()=>{
          const beeteBtn = document.querySelector('[data-view="beete"]');
          if(beeteBtn) beeteBtn.click();
        }});
      }
    }
  }catch(e){}

  // Jetzt säen/pflanzen möglich – als eine Sammel-Aufgabe, springt in den Kalender
  const sowNow = VEG.filter(v=>(v.ds&&v.ds.includes(todayM))||(v.vk&&v.vk.includes(todayM))||(v.ap&&v.ap.includes(todayM)));
  if(sowNow.length>0){
    tasks.push({icon:"🌱",text:`${sowNow.length} Pflanzen können diesen Monat gesät/gepflanzt werden – Kalender ansehen`,onClick:()=>{
      const kalBtn = document.querySelector('[data-view="kalender"]');
      if(kalBtn) kalBtn.click();
    }});
  }

  beds.forEach(bed=>{
    bed.plantings.forEach(p=>{
      const v = vegById(p.vegName);
      if(!v) return;

      if(p.wholebed){
        if(v.einarbeiten && v.einarbeiten.includes(todayM)){
          tasks.push({icon:"🌾",text:`${p.vegName} in „${bed.name}“ einarbeiten/mähen`,onClick:()=>openPlantDetail(bed.id,p.id)});
        }
        return;
      }

      const interval = giessInterval(v) + rainBuffer;
      const dsW = p.lastWatered ? daysSince(p.lastWatered) : daysSince(p.plantDate);
      if(dsW!==null && dsW>=interval){
        tasks.push({icon:"💧",text:`${p.vegName} in „${bed.name}“ gießen`,onClick:()=>openPlantDetail(bed.id,p.id),
          quickDone:()=>{ p.lastWatered = todayISO(); store.save(beds); }});
      }

      const dsF = p.lastFertilized ? daysSince(p.lastFertilized) : daysSince(p.plantDate);
      const fertDue = p.lastFertilized ? dsF>=30 : dsF>=21;
      if(dsF!==null && fertDue){
        tasks.push({icon:"🌿",text:`${p.vegName} in „${bed.name}“ düngen`,onClick:()=>openPlantDetail(bed.id,p.id),
          quickDone:()=>{ p.lastFertilized = todayISO(); p.fertilizerType = p.fertilizerType || FERTILIZERS[0]; store.save(beds); }});
      }

      if(v.er && v.er.includes(todayM)){
        tasks.push({icon:"🧺",text:`${p.vegName} in „${bed.name}“ jetzt erntereif${v.rezept?` – Idee: ${v.rezept}`:""}`,onClick:()=>openPlantDetail(bed.id,p.id)});
      }
    });
  });

  meineStauden.forEach(m=>{
    const v = STAUDEN.find(s=>s.n===m.n);
    if(!v) return;
    const dsW = m.lastWatered ? daysSince(m.lastWatered) : daysSince(m.plantDate);
    if(dsW!==null && dsW>=(v.giess+rainBuffer)){
      tasks.push({icon:"💧",text:`${m.n} (Meine Stauden) gießen`,onClick:()=>openMeineStaudeDetail(m.id),
        quickDone:()=>{ m.lastWatered = todayISO(); staudenStore.save(meineStauden); }});
    }
    const dsF = m.lastFertilized ? daysSince(m.lastFertilized) : daysSince(m.plantDate);
    const fertDue = m.lastFertilized ? dsF>=30 : dsF>=21;
    if(dsF!==null && fertDue){
      tasks.push({icon:"🌿",text:`${m.n} (Meine Stauden) düngen`,onClick:()=>openMeineStaudeDetail(m.id),
        quickDone:()=>{ m.lastFertilized = todayISO(); m.fertilizerType = m.fertilizerType || FERTILIZERS[0]; staudenStore.save(meineStauden); }});
    }
  });

  teiche.forEach(t=>{
    t.plantings.forEach(m=>{
      const dsF = m.lastFertilized ? daysSince(m.lastFertilized) : daysSince(m.plantDate);
      const fertDue = m.lastFertilized ? dsF>=45 : dsF>=30;
      if(dsF!==null && fertDue){
        tasks.push({icon:"🌿",text:`${m.n} (${t.name}) düngen`,onClick:()=>openMeineTeichDetail(t.id,m.id),
          quickDone:()=>{ m.lastFertilized = todayISO(); m.fertilizerType = m.fertilizerType || POND_FERTILIZERS[0]; teicheStore.save(teiche); }});
      }
    });
  });

  return tasks;
}

const NOTIFY_KEY = "beetbuch_notify_on";
const NOTIFY_LAST_KEY = "beetbuch_notify_last";
function notifyEnabled(){ return localStorage.getItem(NOTIFY_KEY)==="1" && typeof Notification!=="undefined" && Notification.permission==="granted"; }

function checkAndNotify(){
  if(!notifyEnabled()) return;
  const tasks = getTasks();
  if(tasks.length===0) return;
  if(localStorage.getItem(NOTIFY_LAST_KEY)===todayISO()) return;
  const body = tasks.slice(0,3).map(t=>t.text).join(", ") + (tasks.length>3?` +${tasks.length-3} weitere`:"");
  const show = reg => reg.showNotification("📋 Anstehende Aufgaben",{body,icon:"icon-192.png",badge:"icon-192.png"});
  if("serviceWorker" in navigator){
    navigator.serviceWorker.ready.then(show).catch(()=>{ try{ new Notification("📋 Anstehende Aufgaben",{body}); }catch(e){} });
  } else {
    try{ new Notification("📋 Anstehende Aufgaben",{body}); }catch(e){}
  }
  localStorage.setItem(NOTIFY_LAST_KEY, todayISO());
}

function monthStrip(v){
  let html = '<div class="mstrip">';
  for(let m=1;m<=12;m++){
    const ds = v.ds && v.ds.includes(m);
    const vk = v.vk && v.vk.includes(m);
    const ap = v.ap && v.ap.includes(m);
    const er = v.er && v.er.includes(m);
    html += `<div class="mcell">
      <div class="seg ${ds||vk?(ds?'on-ds':'on-vk'):''}"></div>
      <div class="seg ${ap?'on-ap':''}"></div>
      <div class="seg ${er?'on-er':''}"></div>
      <div class="mlabel">${MONTH_NAMES[m-1][0]}</div>
    </div>`;
  }
  html += '</div>';
  return html;
}

/* ---------------- Meine Stauden: Gieß- & Pflegefunktion ---------------- */
function renderMeineStauden(){
  const wrap = document.getElementById("meineStaudenList");
  if(meineStauden.length===0){
    wrap.innerHTML = `<div class="emptystate"><span class="ic">🌸</span>Noch keine Staude hinzugefügt.<br>Wechsle zu „Alle Stauden“, öffne eine Pflanze und tippe auf „Zu meinen Stauden hinzufügen“.</div>`;
    return;
  }
  wrap.innerHTML = meineStauden.map(m=>{
    const v = STAUDEN.find(s=>s.n===m.n);
    const interval = v ? v.giess : 5;
    const ds = m.lastWatered ? daysSince(m.lastWatered) : daysSince(m.plantDate);
    const due = ds!==null && ds>=interval;
    return `<div class="bed">
      <div class="bedhead">
        <div class="rowopen" data-open="${m.id}">
          <div class="picon" style="position:static">${v?plantPhotoHtml(m.n,flowerIcon(v.farbe,30),30):""}</div>
          <div><h3>${m.n}</h3><div class="bedmeta">gepflanzt ${fmtDate(m.plantDate)||"–"}</div></div>
        </div>
        <span style="color:${due?'var(--tomato)':'var(--moss-dark)'};font-size:.75rem;font-weight:700;white-space:nowrap;margin-right:8px">${ds===null?'💧 offen':due?'💧 fällig':'💧 vor '+ds+'T'}</span>
        <button class="rowdel" data-qdel="${m.id}" title="Entfernen">🗑</button>
      </div>
    </div>`;
  }).join("");
  wrap.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click",()=>openMeineStaudeDetail(el.dataset.open));
  });
  wrap.querySelectorAll("[data-qdel]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const m = meineStauden.find(x=>x.id===el.dataset.qdel);
      if(!m) return;
      if(!confirm(`„${m.n}“ wirklich aus „Meine Stauden“ entfernen?`)) return;
      meineStauden = meineStauden.filter(x=>x.id!==m.id);
      staudenStore.save(meineStauden);
      renderMeineStauden(); renderStaudenModeChips();
    });
  });
}

/* ---------------- Fotospeicher (IndexedDB, für Teichpflanzen-Fotos) ---------------- */
const photoDB = {
  dbPromise: null,
  open(){
    if(this.dbPromise) return this.dbPromise;
    this.dbPromise = new Promise((resolve,reject)=>{
      if(!("indexedDB" in window)){ reject(new Error("IndexedDB nicht verfügbar")); return; }
      const req = indexedDB.open("beetbuch_fotos_db",1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore("photos"); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
    return this.dbPromise;
  },
  async set(key,dataUrl){
    const db = await this.open();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("photos","readwrite");
      tx.objectStore("photos").put(dataUrl,key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  },
  async get(key){
    const db = await this.open();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("photos","readonly");
      const req = tx.objectStore("photos").get(key);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  },
  async delete(key){
    const db = await this.open();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("photos","readwrite");
      tx.objectStore("photos").delete(key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }
};
function compressImage(file,maxSize,quality){
  maxSize = maxSize||900; quality = quality||0.72;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h && w>maxSize){ h = Math.round(h*(maxSize/w)); w = maxSize; }
        else if(h>=w && h>maxSize){ w = Math.round(w*(maxSize/h)); h = maxSize; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const wrap = document.getElementById("meineTeichListe");
  if(teiche.length===0){
    wrap.innerHTML = `<div class="emptystate"><span class="ic">🌿</span>Noch kein Teich angelegt.<br>Leg deinen ersten Teich an, um eingesetzte Pflanzen mit Pflege & Düngung zu verfolgen.</div>`;

      return `<div class="bed teichcard" data-teich="${t.id}">
        <div class="pondphoto" id="pondphoto-${t.id}"></div>
        <div class="bedhead">
          <div><h3>${t.name}</h3><div class="bedmeta">${t.size||"—"} · ${t.plantings.length} Pflanze${t.plantings.length===1?"":"n"}</div></div>
          <div style="display:flex;gap:6px">
            <button class="btn small secondary" data-editteich="${t.id}">✎</button>
            <button class="btn small tomato" data-delteich="${t.id}" title="Teich löschen">🗑</button>
          </div>

        <button class="btn block" data-addteichplant="${t.id}" style="margin-top:12px">+ Pflanze hinzufügen</button>
      </div>`;
    }).join("");
  }

  wrap.querySelectorAll("[data-addteichplant]").forEach(b=>{
    b.addEventListener("click",()=>openAddTeichPlanting(b.dataset.addteichplant));
  });
  wrap.querySelectorAll("[data-editteich]").forEach(b=>{
    b.addEventListener("click",()=>openEditTeich(b.dataset.editteich));
  });
  wrap.querySelectorAll("[data-delteich]").forEach(b=>{
    b.addEventListener("click",()=>{
      const t = teiche.find(x=>x.id===b.dataset.delteich);
      if(!t) return;
      if(!confirm(`Teich „${t.name}“ wirklich vollständig löschen? Alle darin enthaltenen Pflanzen gehen verloren.`)) return;
      teiche = teiche.filter(x=>x.id!==t.id);
      teicheStore.save(teiche); renderMeineTeich(); renderTeichModeChips();
    });
  });
  wrap.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click",()=>{
      const [teichId,plantId] = el.dataset.open.split("|");
      openMeineTeichDetail(teichId,plantId);
    });
  });
  wrap.querySelectorAll("[data-qdel]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const [teichId,plantId] = el.dataset.qdel.split("|");
      const t = teiche.find(x=>x.id===teichId);
      const m = t && t.plantings.find(x=>x.id===plantId);
      if(!m) return;
      if(!confirm(`„${m.n}“ wirklich aus „${t.name}“ entfernen?`)) return;
      photoDB.delete(plantId).catch(()=>{});
      t.plantings = t.plantings.filter(x=>x.id!==plantId);
      teicheStore.save(teiche); renderMeineTeich(); renderTeichModeChips();
    });
  });

  // Teichfotos asynchron laden und anzeigen (eigenes Foto pro Teich, unabhängig von Pflanzenfotos)
  teiche.forEach(t=>{
    const el = document.getElementById(`pondphoto-${t.id}`);
    if(!el) return;
    const wireAddBtn = ()=>{
      el.querySelector("[data-pondphoto]")?.addEventListener("click",(e)=>{
        e.stopPropagation();
        pondPhotoTargetId = t.id;
        document.getElementById("pondPhotoGlobalInput").click();
      });
    };
    photoDB.get(t.id).then(photo=>{
      if(photo){
        el.innerHTML = `<img src="${photo}" alt="${t.name}">

          <button class="pondphoto-mini" data-pondphotodel="${t.id}" title="Foto entfernen">🗑</button>`;

          if(!confirm("Teichfoto wirklich entfernen?")) return;
          await photoDB.delete(t.id).catch(()=>{});
          renderMeineTeich();
        });
        wireAddBtn();
      } else {
        el.innerHTML = `<button class="pondphoto-btn" data-pondphoto="${t.id}">📷 Teichfoto hinzufügen</button>`;
        wireAddBtn();
      }
    }).catch(()=>{
      el.innerHTML = `<button class="pondphoto-btn" data-pondphoto="${t.id}">📷 Teichfoto hinzufügen</button>`;
      wireAddBtn();
    });
  });

  // Pflanzenfotos asynchron laden – zeigt das eigene Foto der Pflanze statt des Icons, falls vorhanden
  teiche.forEach(t=>{
    t.plantings.forEach(m=>{
      const el = document.getElementById(`plantthumb-${m.id}`);
      if(!el) return;
      photoDB.get(m.id).then(photo=>{
        if(photo){ el.innerHTML = `<img src="${photo}" alt="${m.n}">`; }
      }).catch(()=>{});
    });
  });
}

async function collectAllPhotos(){
  try{
    const db = await photoDB.open();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction("photos","readonly");
      const store = tx.objectStore("photos");
      const result = {};
      const req = store.openCursor();
      req.onsuccess = e=>{
        const cursor = e.target.result;
        if(cursor){ result[cursor.key] = cursor.value; cursor.continue(); }
        else resolve(result);
      };
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return {}; }
}
async function exportAllData(){
  const status = document.getElementById("backupStatus");
  if(status) status.textContent = "⏳ Sammle Daten…";
  const photos = await collectAllPhotos();
  const data = {
    app: "Beetbuch", version: 1, exportedAt: new Date().toISOString(),
    beds, meineStauden, teiche, teichWerte, photos,
    settings: {
      notifyOn: localStorage.getItem(NOTIFY_KEY),
      theme: localStorage.getItem(THEME_KEY),
      weatherLoc: localStorage.getItem(WEATHER_LOC_KEY)
    }
  };
  const blob = new Blob([JSON.stringify(data)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `beetbuch-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  if(status) status.textContent = "✅ Export heruntergeladen.";
}
function importAllData(file){
  const status = document.getElementById("backupStatus");
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ if(status) status.textContent = "❌ Datei konnte nicht gelesen werden."; return; }
    if(data.app!=="Beetbuch"){ if(status) status.textContent = "❌ Das scheint keine Beetbuch-Sicherung zu sein."; return; }
    const datum = data.exportedAt ? fmtDate(data.exportedAt.slice(0,10)) : "unbekanntem Datum";
    if(!confirm(`Backup vom ${datum} einspielen? Das überschreibt deine aktuellen Daten in dieser App.`)) return;
    localStorage.setItem("beetbuch_beds", JSON.stringify(data.beds||[]));
    localStorage.setItem("beetbuch_meine_stauden", JSON.stringify(data.meineStauden||[]));
    localStorage.setItem("beetbuch_teiche", JSON.stringify(data.teiche||[]));
    localStorage.setItem("beetbuch_teich_werte", JSON.stringify(data.teichWerte||[]));
    if(data.settings){
      if(data.settings.notifyOn!=null) localStorage.setItem(NOTIFY_KEY, data.settings.notifyOn);
      if(data.settings.theme!=null) localStorage.setItem(THEME_KEY, data.settings.theme);
      if(data.settings.weatherLoc!=null) localStorage.setItem(WEATHER_LOC_KEY, data.settings.weatherLoc);
    }
    if(data.photos){
      try{ for(const [key,val] of Object.entries(data.photos)){ await photoDB.set(key,val); } }catch(err){}
    }
    if(status) status.textContent = "✅ Backup eingespielt – lade neu…";
    setTimeout(()=>window.location.reload(),600);
  };
  reader.readAsText(file);
}

function renderBeds(){
  const wrap = document.getElementById("bedsList");

  // Anstehende Aufgaben
  const tasks = getTasks();
  const remindBar = document.getElementById("remindBar");
  if(tasks.length>0){
    remindBar.innerHTML = `<div class="remindbar">
      ${tasks.map((t,i)=>`<div class="ritem" data-task="${i}">
        <span class="ritem-text">${t.icon} ${t.text}</span>
        ${t.quickDone ? `<button class="quickdone" data-done="${i}" title="Erledigt">✓</button>` : ""}
      </div>`).join("")}
    </div>`;
    remindBar.querySelectorAll(".ritem-text").forEach(el=>{
      el.addEventListener("click",()=>{
        const i = parseInt(el.closest("[data-task]").dataset.task,10);
        tasks[i].onClick();
      });
    });
    remindBar.querySelectorAll("[data-done]").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.stopPropagation();
        const i = parseInt(el.dataset.done,10);
        tasks[i].quickDone();
        el.closest(".ritem").style.opacity = "0";
        setTimeout(()=>{ renderBeds(); },220);
      });
    });
  } else {
    remindBar.innerHTML = `<div class="okbox" style="margin-bottom:14px">✅ Aktuell liegt nichts an – alles im grünen Bereich.</div>`;
  }
  document.querySelector('[data-view="beete"] .dot')?.remove();
  if(tasks.length>0){
    const beeteTab = document.querySelector('[data-view="beete"]');
    const dot = document.createElement("span");
    dot.className = "dot";
    beeteTab.appendChild(dot);
  }

  if(beds.length===0){
    wrap.innerHTML = `<div class="emptystate"><span class="ic">🧑‍🌾</span>Noch kein Beet angelegt.<br>Leg dein erstes Beet an, um Fruchtfolge und Mischkultur im Blick zu behalten.</div>`;
    return;
  }
  wrap.innerHTML = beds.map(bed=>{
    const rows = bed.rows || 3, cols = bed.cols || 4;
    const currentYear = new Date().getFullYear();
    const plantYear = p => p.plantDate ? parseInt(p.plantDate.slice(0,4),10) : p.year;
    const plantingsThisYear = bed.plantings.filter(p=>plantYear(p)===currentYear);

    // Fruchtfolge-Check: gleiche Familie in den letzten 3 Jahren (nur einjähriges Gemüse)
    let rotationWarning = "";
    const recentYears = bed.plantings.filter(p=>plantYear(p)>=currentYear-3 && plantYear(p)<currentYear);
    plantingsThisYear.forEach(cur=>{
      const curVeg = vegById(cur.vegName);
      const curKind = plantKind(curVeg);
      if(curVeg && (curVeg.perennial || curKind==="gruen" || curKind==="staude")) return;
      const clash = recentYears.find(p=>{
        const pv = vegById(p.vegName);
        return pv && !pv.perennial && curVeg && pv.fk===curVeg.fk;
      });
      if(clash){
        rotationWarning += `<div class="warnbox">⚠️ <b>${cur.vegName}</b> steht in einer Familie mit <b>${clash.vegName}</b> (${plantYear(clash)}) im selben Beet – für die Fruchtfolge besser 3–4 Jahre Abstand einhalten.</div>`;
      }
    });

    // Nachbarschafts-Check innerhalb des aktuellen Jahres
    let neighborWarning = "";
    for(let i=0;i<plantingsThisYear.length;i++){
      for(let j=i+1;j<plantingsThisYear.length;j++){
        const a = vegById(plantingsThisYear[i].vegName);
        const b = vegById(plantingsThisYear[j].vegName);
        if(a && b && (a.sn||[]).includes(b.n)){
          neighborWarning += `<div class="warnbox">🚫 <b>${a.n}</b> und <b>${b.n}</b> vertragen sich als Nachbarn nicht so gut.</div>`;
        }
      }
    }
    let goodPairs = "";
    for(let i=0;i<plantingsThisYear.length;i++){
      for(let j=i+1;j<plantingsThisYear.length;j++){
        const a = vegById(plantingsThisYear[i].vegName);
        const b = vegById(plantingsThisYear[j].vegName);
        if(a && b && (a.gn||[]).includes(b.n)){
          goodPairs += `<div class="okbox">✅ <b>${a.n}</b> und <b>${b.n}</b> sind gute Nachbarn.</div>`;
        }
      }
    }

    // Zehrertyp-Kennzeichnung: welcher Nährstoffbedarf dominiert im Beet dieses Jahr
    const zehrerCount = {S:0,M:0,W:0};
    plantingsThisYear.forEach(p=>{
      const v = vegById(p.vegName);
      if(v && v.z && zehrerCount[v.z]!==undefined) zehrerCount[v.z]++;
    });
    const zehrerTotal = zehrerCount.S+zehrerCount.M+zehrerCount.W;
    let zehrerHtml = "";
    if(zehrerTotal>0){
      const zLabel = {S:"Starkzehrer",M:"Mittelzehrer",W:"Schwachzehrer"};
      const zColor = {S:"#C1543C",M:"#D4A73D",W:"#5B7553"};
      const nextLabel = {S:"Mittelzehrer",M:"Schwachzehrer",W:"Starkzehrer oder Gründüngung"};
      const dominant = Object.keys(zehrerCount).reduce((a,b)=>zehrerCount[b]>zehrerCount[a]?b:a);
      const arten = Object.entries(zehrerCount).filter(([,c])=>c>0);
      const mixed = arten.length>1;
      const detail = mixed ? arten.map(([k,c])=>`${c}× ${zLabel[k]}`).join(", ") : "";
      zehrerHtml = `<div class="zehrerbadge" style="border-color:${zColor[dominant]}">
        <span style="color:${zColor[dominant]}">🌿 ${mixed?"Gemischt, überwiegend "+zLabel[dominant]:zLabel[dominant]+"-Beet"}</span>
        ${mixed?`<span class="zehrerdetail">${detail}</span>`:""}
        <span class="zehrernext">Nächste Saison empfohlen: ${nextLabel[dominant]}</span>
      </div>`;
    }

    // Gründüngung: bedeckt das ganze Beet, kein Einzelplatz
    const gruenAktiv = bed.plantings.filter(p=>p.wholebed);
    const gruenHtml = gruenAktiv.length ? `<div class="wholebedbanner">
      ${gruenAktiv.map(p=>`<div class="gditem" data-open="${bed.id}|${p.id}">
        <span>🌾 <b>${p.vegName}</b> begrünt das ganze Beet · seit ${fmtDate(p.plantDate)||p.year}</span>
        <button class="delx" data-del="${bed.id}|${p.id}" title="Entfernen">✕</button>
      </div>`).join("")}
    </div>` : "";

    // Lageplan-Grid
    let gridHtml = `<div class="bedgrid" style="grid-template-columns:repeat(${cols},1fr)${gruenAktiv.length?';opacity:.35':''}">`;
    for(let i=0;i<rows*cols;i++){
      const p = bed.plantings.find(x=>x.cell===i);
      if(p){
        const v = vegById(p.vegName);
        gridHtml += `<div class="gcell" style="background:${plantColor(v)}" data-bed="${bed.id}" data-cell="${i}" data-plant="${p.id}" title="${p.vegName}">
          <button class="gcell-del" data-del="${bed.id}|${p.id}" title="Entfernen">✕</button>
          ${p.vegName.length>7?p.vegName.slice(0,6)+"…":p.vegName}
        </div>`;
      } else {
        gridHtml += `<div class="gcell empty" data-bed="${bed.id}" data-cell="${i}">+</div>`;
      }
    }
    gridHtml += `</div>`;

    const unplaced = bed.plantings.filter(p=>p.cell==null && !p.wholebed);
    const unplacedHtml = unplaced.length ? `<div class="unplaced">${unplaced.map(p=>`<span class="tag" data-open="${bed.id}|${p.id}">${p.vegName} · keine Position <b class="tagdel" data-del="${bed.id}|${p.id}">✕</b></span>`).join("")}</div>` : "";

    return `<div class="bed" data-bed="${bed.id}">
      <div class="bedhead">
        <div><h3>${bed.name}</h3><div class="bedmeta">${bed.size||"—"} · ${rows}×${cols} Felder</div></div>
        <div style="display:flex;gap:6px">
          <button class="btn small secondary" data-editbed="${bed.id}">✎ Bearbeiten</button>
          <button class="btn small tomato" data-delbed="${bed.id}" title="Beet löschen">🗑</button>
          <button class="btn small" data-addplant="${bed.id}">+ Pflanze</button>
        </div>
      </div>
      ${zehrerHtml}
      ${gruenHtml}
      ${gridHtml}
      ${unplacedHtml}
      ${rotationWarning}${neighborWarning}${goodPairs}
    </div>`;
  }).join("");

  function deletePlanting(bedId,plantId){
    const bed = beds.find(b=>b.id===bedId);
    const p = bed.plantings.find(x=>x.id===plantId);
    if(!p) return;
    if(!confirm(`„${p.vegName}“ wirklich aus dem Beet entfernen?`)) return;
    bed.plantings = bed.plantings.filter(x=>x.id!==plantId);
    store.save(beds); renderBeds();
  }

  wrap.querySelectorAll("[data-del]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const [bedId,plantId] = el.dataset.del.split("|");
      deletePlanting(bedId,plantId);
    });
  });
  wrap.querySelectorAll(".gditem[data-open]").forEach(el=>{
    el.addEventListener("click",()=>{
      const [bedId,plantId] = el.dataset.open.split("|");
      openPlantDetail(bedId,plantId);
    });
  });
  wrap.querySelectorAll("[data-addplant]").forEach(b=>{
    b.addEventListener("click",()=>openAddPlanting(b.dataset.addplant));
  });
  wrap.querySelectorAll("[data-editbed]").forEach(b=>{
    b.addEventListener("click",()=>openEditBed(b.dataset.editbed));
  });
  wrap.querySelectorAll("[data-delbed]").forEach(b=>{
    b.addEventListener("click",()=>{
      const bed = beds.find(x=>x.id===b.dataset.delbed);
      if(!bed) return;
      if(!confirm(`Beet „${bed.name}“ wirklich vollständig löschen? Alle darin gepflanzten Pflanzen gehen verloren.`)) return;
      beds = beds.filter(x=>x.id!==bed.id);
      store.save(beds); renderBeds();
    });
  });
  wrap.querySelectorAll(".gcell").forEach(c=>{
    c.addEventListener("click",(e)=>{
      if(e.target.classList.contains("gcell-del")) return;
      const bedId = c.dataset.bed, cell = parseInt(c.dataset.cell,10);
      if(c.dataset.plant){ openPlantDetail(bedId, c.dataset.plant); }
      else { openAddPlanting(bedId, cell); }
    });
  });
  wrap.querySelectorAll(".unplaced [data-open]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      if(e.target.classList.contains("tagdel")) return;
      const [bedId,plantId] = el.dataset.open.split("|");
      openPlantDetail(bedId,plantId);
    });
  });
}

/* ---------------- Mehrjahres-Fruchtfolge-Planer ---------------- */
function openFruchtfolgePlan(bedId){
  const bed = beds.find(b=>b.id===bedId);
  const currentYear = new Date().getFullYear();
  const plantYear = p => p.plantDate ? parseInt(p.plantDate.slice(0,4),10) : p.year;
  const zehrerCount = {S:0,M:0,W:0};
  bed.plantings.filter(p=>plantYear(p)===currentYear && !p.wholebed).forEach(p=>{
    const v = vegById(p.vegName);
    if(v && v.z && zehrerCount[v.z]!==undefined) zehrerCount[v.z]++;
  });
  const total = zehrerCount.S+zehrerCount.M+zehrerCount.W;
  const dominant = total>0 ? Object.keys(zehrerCount).reduce((a,b)=>zehrerCount[b]>zehrerCount[a]?b:a) : "S";
  const sequence = ["S","M","W","gruen"];
  const startIdx = sequence.indexOf(dominant);
  const zLabel = {S:"Starkzehrer",M:"Mittelzehrer",W:"Schwachzehrer",gruen:"Gründüngung"};
  const zColor = {S:"#C1543C",M:"#D4A73D",W:"#5B7553",gruen:"#7A9B4E"};
  const examplesFor = t => t==="gruen"
    ? GRUENDUENGUNG.slice(0,3).map(g=>g.n)
    : VEG.filter(v=>v.z===t && !v.perennial).slice(0,4).map(v=>v.n);

  const plan = [];
  for(let i=0;i<4;i++){
    const idx = (startIdx+i)%sequence.length;
    plan.push({year:currentYear+i, type:sequence[idx]});
  }

  const sheet = document.getElementById("formSheet");
  sheet.innerHTML = `
    <button class="closebtn" id="closeForm">✕</button>
    <div class="handle"></div>
    <h2>📅 Mehrjahres-Fruchtfolge</h2>
    <div class="sub">Vorschlag für „${bed.name}“${total>0?` – aktuell überwiegend ${zLabel[dominant]}`:" – noch keine Pflanzung in diesem Jahr erfasst"}</div>
    ${plan.map((p,i)=>`
      <div class="infobox" style="margin-top:10px;border-left:4px solid ${zColor[p.type]}">
        <div class="eyebrow">${p.year}${i===0?" · aktuell":""}</div>
        <p style="font-weight:700">${zLabel[p.type]}</p>
        <div style="font-size:.78rem;color:#00000070;margin-top:4px">z. B. ${examplesFor(p.type).join(", ")}</div>
      </div>
    `).join("")}
    <div style="font-size:.7rem;color:#00000060;margin-top:12px">Faustregel-Vorschlag nach dem klassischen Prinzip Starkzehrer → Mittelzehrer → Schwachzehrer → Gründüngung. Ersetzt keine genaue Planung – bitte an deine tatsächlichen Pflanzenwünsche anpassen.</div>
  `;
  document.getElementById("formOverlay").classList.add("active");
  document.getElementById("closeForm").addEventListener("click",closeForm);
}

function freeCells(bed){
  const rows = bed.rows||3, cols = bed.cols||4;
  const occupied = new Set(bed.plantings.filter(p=>p.cell!=null).map(p=>p.cell));
  const arr = [];
  for(let i=0;i<rows*cols;i++) if(!occupied.has(i)) arr.push(i);
  return arr;
}
function cellLabel(bed,i){
  const cols = bed.cols||4;
  return `Reihe ${Math.floor(i/cols)+1}, Spalte ${(i%cols)+1}`;
}

function openAddPlanting(bedId, prefillCell){
  const bed = beds.find(b=>b.id===bedId);

        <select id="plantCell">

          ${freeCells(bed).map(i=>`<option value="${i}">${cellLabel(bed,i)}</option>`).join("")}
        </select>
      </div>`;
  const positionFieldPrefill = `<div class="field"><label>Position</label><p style="margin:0;font-weight:600">${cellLabel(bed,prefillCell)}</p></div>`;
  const positionFieldGruen = `<div class="field" id="gruenHint"><div class="okbox" style="margin-top:0">🌾 Gründüngung begrünt das ganze Beet – keine Einzelposition nötig.</div></div>`;

  sheet.innerHTML = `
    <button class="closebtn" id="closeForm">✕</button>
    <div class="handle"></div>
    <h2>Pflanze hinzufügen</h2>
    <div class="field"><label>Gemüse, Obst, Kraut, Staude oder Gründüngung</label>
      <select id="plantVeg">
        ${Object.entries(FAMILIES).filter(([fk])=>fk!=="gruen").map(([fk,label])=>`
          <optgroup label="${label}">
            ${VEG.filter(v=>v.fk===fk).map(v=>`<option value="${v.n}">${v.n}</option>`).join("")}
          </optgroup>
        `).join("")}
        <optgroup label="🌸 Stauden">
          ${STAUDEN.map(v=>`<option value="${v.n}">${v.n}</option>`).join("")}
        </optgroup>
        <optgroup label="🌾 Gründüngung (ganzes Beet)">
          ${GRUENDUENGUNG.map(v=>`<option value="${v.n}" data-gd="1">${v.n}</option>`).join("")}
        </optgroup>
      </select>
    </div>
    <div class="field"><label>Pflanzdatum</label>
      <input type="date" id="plantDate" value="${todayISO()}">
    </div>
    <div id="posWrap">${prefillCell!=null ? positionFieldPrefill : positionFieldNormal}</div>
    <button class="btn block" id="savePlanting">Hinzufügen</button>
  `;
  document.getElementById("formOverlay").classList.add("active");
  document.getElementById("closeForm").addEventListener("click",closeForm);

  const vegSelect = document.getElementById("plantVeg");
  const posWrap = document.getElementById("posWrap");
  function isGD(){ return vegSelect.options[vegSelect.selectedIndex].dataset.gd==="1"; }
  vegSelect.addEventListener("change",()=>{
    if(prefillCell!=null) return; // feste Position durch Klick auf Zelle bleibt bestehen
    posWrap.innerHTML = isGD() ? positionFieldGruen : positionFieldNormal;
  });

  document.getElementById("savePlanting").addEventListener("click",()=>{
    const plantDate = document.getElementById("plantDate").value || todayISO();

    bed.plantings.push({
      id:"p"+Date.now(),
      vegName:vegSelect.value,
      plantDate,
      year:parseInt(plantDate.slice(0,4),10),
      lastWatered:null,
      cell,
      wholebed:gd
    });
    store.save(beds); closeForm(); renderBeds();
  });
}

  const sheet = document.getElementById("formSheet");
  const interval = giessInterval(v);
  const ds = daysSince(p.lastWatered);

  function draw(){
    const dsNow = daysSince(p.lastWatered);
    const dueNow = dsNow!==null && dsNow>=interval;

    if(p.wholebed){
      const einM = (v.einarbeiten||[]).map(m=>MONTH_NAMES[m-1]).join(", ") || "—";

function renderMonthPicker(){
  const wrap = document.getElementById("monthPicker");

    `<button class="${calMonth===i+1?'active':''}" data-m="${i+1}">${m}</button>`

}

const OBST_NAMES = ["Erdbeere","Himbeere","Brombeere","Johannisbeere","Stachelbeere","Heidelbeere","Apfelbaum","Birnbaum","Kirschbaum","Pflaumenbaum","Weinrebe","Rhabarber"];
const KRAUT_NAMES = ["Basilikum","Petersilie","Schnittlauch","Dill","Thymian","Rosmarin","Oregano","Minze","Salbei","Koriander","Majoran","Estragon"];
function artOf(v){
  if(OBST_NAMES.includes(v.n)) return "Obst";
  if(KRAUT_NAMES.includes(v.n)) return "Kräuter";
  return "Gemüse";
}

/* ====================================================================
   MONDKALENDER – rein rechnerische Mondphase als Aussaat-Faustregel
   (traditionelle Gärtnerregel, wissenschaftlich nicht eindeutig belegt)
   ==================================================================== */
function moonPhaseValue(date){
  date = date || new Date();
  const knownNewMoon = Date.UTC(2000,0,6,18,14);
  const synodicMonth = 29.53058867;
  const diffDays = (date.getTime()-knownNewMoon)/86400000;
  let phase = (diffDays % synodicMonth)/synodicMonth;
  if(phase<0) phase += 1;
  return phase;
}
function moonIcon(phase){
  if(phase<0.02||phase>0.98) return "🌑";
  if(phase<0.23) return "🌒";
  if(phase<0.27) return "🌓";
  if(phase<0.48) return "🌔";
  if(phase<0.52) return "🌕";
  if(phase<0.73) return "🌖";
  if(phase<0.77) return "🌗";
  return "🌘";
}
function getMoonInfo(date){
  const phase = moonPhaseValue(date);
  const waxing = phase<0.5;
  let label;
  if(phase<0.02||phase>0.98) label = "Neumond";
  else if(phase>0.48 && phase<0.52) label = "Vollmond";
  else if(waxing) label = "Zunehmender Mond";
  else label = "Abnehmender Mond";
  const empfehlung = waxing
    ? "Faustregel: günstig für Aussaat & Pflanzung oberirdisch wachsender Pflanzen (Blatt-, Frucht- und Blütengemüse)."
    : "Faustregel: günstig für Wurzelgemüse, Umpflanzen, Rückschnitt und die Ernte von Wurzeln/Knollen.";
  return {phase, icon:moonIcon(phase), label, empfehlung, waxing};
}
let moonMonthOpen = false;
function renderMoonWidget(){
  const box = document.getElementById("moonBox");
  if(!box) return;
  const m = getMoonInfo();
  box.innerHTML = `<div class="toolcard">
    <div class="eyebrow">🌙 Mondkalender (Faustregel)</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:6px">
      <div style="font-size:2rem">${m.icon}</div>
      <div>
        <div style="font-weight:700;color:var(--ink)">${m.label}</div>
        <div style="font-size:.78rem;color:#00000080;margin-top:2px;line-height:1.4">${m.empfehlung}</div>
      </div>
    </div>
    <button id="moonMonthToggle" style="background:none;border:none;color:var(--moss-dark);font-size:.75rem;font-weight:700;margin-top:8px;padding:0">${moonMonthOpen?"▲ Monatsübersicht ausblenden":"▼ Monatsübersicht anzeigen"}</button>
    <div id="moonMonthGrid" style="display:${moonMonthOpen?"block":"none"};margin-top:8px"></div>
    <div style="font-size:.62rem;color:#00000060;margin-top:8px">Traditionelle Gärtner-Faustregel, wissenschaftlich nicht eindeutig belegt – als zusätzliche Orientierung gedacht.</div>
  </div>`;
  document.getElementById("moonMonthToggle").addEventListener("click",()=>{
    moonMonthOpen = !moonMonthOpen;
    renderMoonWidget();
    if(moonMonthOpen) renderMoonMonthGrid();
  });
  if(moonMonthOpen) renderMoonMonthGrid();
}
function renderMoonMonthGrid(){
  const grid = document.getElementById("moonMonthGrid");
  if(!grid) return;
  const now = new Date();
  const year = now.getFullYear();
  const numDays = new Date(year, calMonth, 0).getDate();
  let html = `<div class="moongrid">`;
  for(let d=1; d<=numDays; d++){
    const date = new Date(year, calMonth-1, d);
    const info = getMoonInfo(date);
    const isToday = date.toDateString()===now.toDateString();
    html += `<div class="moonday${isToday?" today":""}" title="${d}.${calMonth}. – ${info.label}">
      <div>${info.icon}</div>
      <div class="moonnum">${d}</div>
    </div>`;
  }
  html += `</div>`;
  grid.innerHTML = html;
}

function renderCalendar(){
  renderMonthPicker();
  renderMoonWidget();
  const ds = VEG.filter(v=>v.ds && v.ds.includes(calMonth));
  const vk = VEG.filter(v=>v.vk && v.vk.includes(calMonth));
  const ap = VEG.filter(v=>v.ap && v.ap.includes(calMonth));
  const er = VEG.filter(v=>v.er && v.er.includes(calMonth));
  const bluehend = STAUDEN.filter(v=>v.bluete && v.bluete.includes(calMonth));

  function section(title,color,list){
    if(list.length===0) return `<div class="calsection"><h3><i style="background:${color}"></i>${title}</h3><div class="callist"><div class="item" style="color:#00000060">Diesen Monat nichts vorgesehen.</div></div></div>`;
    const groups = {"Gemüse":[],"Obst":[],"Kräuter":[]};
    list.forEach(v=>groups[artOf(v)].push(v));
    const groupHtml = Object.entries(groups).filter(([,arr])=>arr.length>0).map(([art,arr])=>`
      <div class="callist-label">${art} (${arr.length})</div>
      <div class="callist">${arr.map(v=>`<div class="item"><b>${v.n}</b> <span>· ${FAMILIES[v.fk]}</span></div>`).join("")}</div>
    `).join("");
    return `<div class="calsection">
      <h3><i style="background:${color}"></i>${title}</h3>
      ${groupHtml}
    </div>`;
  }

  function blumenSection(){
    if(bluehend.length===0) return `<div class="calsection"><h3><i style="background:#C85C9E"></i>🌸 Blumen in Blüte</h3><div class="callist"><div class="item" style="color:#00000060">Diesen Monat blüht keine hinterlegte Staude.</div></div></div>`;
    return `<div class="calsection">
      <h3><i style="background:#C85C9E"></i>🌸 Blumen in Blüte</h3>
      <div class="callist">${bluehend.map(v=>`<div class="item" data-blume="${v.n}" style="cursor:pointer"><b>${v.n}</b> <span>· ${v.sun}</span></div>`).join("")}</div>
    </div>`;
  }

  document.getElementById("calContent").innerHTML =
    section("Direktsaat jetzt","var(--moss)",ds) +
    section("Vorziehen (drinnen)","var(--mustard)",vk) +
    section("Auspflanzen jetzt","var(--moss-dark)",ap) +
    section("Ernte jetzt","var(--tomato)",er) +
    blumenSection();

  document.querySelectorAll("[data-blume]").forEach(el=>{
    el.addEventListener("click",()=>{
      const v = STAUDEN.find(s=>s.n===el.dataset.blume);
      if(v) openStaudenDetail(v);
    });
  });
}

/* ---------------- Wischen zwischen den Reitern ---------------- */
(function setupSwipeNav(){
  const TAB_ORDER = ["lexikon","beete","stauden","teich","kalender"];
  const main = document.querySelector("main");
  if(!main) return;
  const threshold = 60;
  let startX = 0, startY = 0, tracking = false;

  function overlayOpen(){
    const d = document.getElementById("detailOverlay");
    const f = document.getElementById("formOverlay");
    return (d && d.classList.contains("active")) || (f && f.classList.contains("active"));
  }
  function currentIndex(){
    const activeBtn = document.querySelector("nav.tabbar button.active");
    return activeBtn ? TAB_ORDER.indexOf(activeBtn.dataset.view) : -1;
  }
  function goTo(idx){
    if(idx<0 || idx>=TAB_ORDER.length) return;
    const btn = document.querySelector(`nav.tabbar button[data-view="${TAB_ORDER[idx]}"]`);
    if(btn) btn.click();
  }

  main.addEventListener("touchstart",e=>{
    if(overlayOpen() || e.touches.length!==1 || e.target.closest(".monthpicker")){ tracking=false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  },{passive:true});

  main.addEventListener("touchend",e=>{
    if(!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) < threshold || Math.abs(dy) > Math.abs(dx)*0.6) return;
    const idx = currentIndex();
    if(idx===-1) return;
    goTo(dx<0 ? idx+1 : idx-1);
  },{passive:true});
})();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      // Neue Version erkennen und Hinweis-Banner anzeigen
      function promptUpdate(){
        if(document.getElementById("updateBanner")) return;
        const bar = document.createElement("div");
        bar.id = "updateBanner";
        bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:70px;z-index:50;background:var(--mustard);color:var(--soil);border-radius:12px;padding:12px 14px;box-shadow:0 4px 14px #00000040;font-size:.85rem;display:flex;align-items:center;justify-content:space-between;gap:10px;";
        bar.innerHTML = `<span>🔄 Neue Version verfügbar</span><button style="background:var(--soil);color:var(--cream);border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:.8rem">Aktualisieren</button>`;
        bar.querySelector("button").addEventListener("click",()=>window.location.reload());
        document.body.appendChild(bar);
      }
      if(reg.waiting){ promptUpdate(); }
      reg.addEventListener("updatefound",()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange",()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            promptUpdate();
          }
        });
      });
      // Regelmäßig aktiv nach Updates suchen (z. B. beim erneuten Öffnen der App)
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{
        if(document.visibilityState==="visible") reg.update().catch(()=>{});
      });

      if("periodicSync" in reg && navigator.permissions){
        navigator.permissions.query({name:"periodic-background-sync"}).then(status=>{
          if(status.state==="granted"){
            reg.periodicSync.register("water-check",{minInterval:24*60*60*1000}).catch(()=>{});
          }
        }).catch(()=>{});
      }
    }).catch(()=>{});

    // Sobald der neue Service Worker aktiv übernimmt, Seite einmalig neu laden
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(reloading) return;
      reloading = true;
      window.location.reload();
    });
  });
}
